interface:
  display_name: "员工动机诊断"
  short_description: "用飞书证据做细颗粒度动机诊断，输出总分式报告、具体行动和可选飞书文档画板"
  default_prompt: "使用 $employee-motivation 基于飞书 OKR、文档、会议表现、日程和员工与 Agent 的交流，采用麦克利兰×SDT 双模型诊断工作动机。先给四行结论表，再逐维度展开证据、推断逻辑、置信度和证据缺口；把下一步绑定到真实项目、会议或流程，写出动作、指标、时间锚点和决策边界。用户要求报告或沉淀时，生成完整文字总结、飞书云文档，并关联 Geometry Blue 画板。员工自测给发展建议，Leader/HR 他评给管理视角建议；行为为推断需本人确认，不做性格标签、绩效打分或背对背画像。"
