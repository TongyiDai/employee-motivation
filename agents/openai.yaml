interface:
  display_name: "员工动机诊断"
  short_description: "用飞书证据做动机诊断，输出短结论表、细节证据链、具体行动与参考版式画板"
  default_prompt: "使用 $employee-motivation 基于飞书 OKR、文档、会议表现、日程和员工与 Agent 的交流，采用麦克利兰×SDT 双模型诊断工作动机。先给一句话判断和短结论表，再逐维度展开完整证据、推断逻辑、置信度、替代解释和证据缺口；采用专业且有人味的同事+咨询风格，把下一步绑定到真实项目、会议或流程，写出动作、指标、时间锚点和决策边界。用户要求报告或沉淀时，生成完整文字总结、飞书云文档，并将蓝色—米色—深蓝总览画板紧跟文档标题作为第一个正文块，中段放 2–3 张同版式 Geometry Blue 画板，写入画板直达链接并回读验证。员工自测给发展建议，Leader/HR 他评给管理视角建议；行为为推断需本人确认，不做性格标签、绩效打分或背对背画像。"
