<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>同一份诊断，两种视角</title>
  <desc>Geometry Board for the 员工动机诊断 skill.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#222222" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF" />
  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">同一份诊断，两种视角</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">员工自测给发展建议，Leader/HR 他评给管理建议</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><circle cx="600" cy="250" r="46" fill="#2F6BFF" stroke="#222222" stroke-width="1.5" /><text x="600" y="242.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">同一份</text><text x="600" y="262.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">诊断</text><rect x="140" y="380" width="420" height="150" fill="#F5F5F5" stroke="#222222" stroke-width="1.4" /><text x="350" y="414" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" letter-spacing="0px" fill="#111111">员工自测 · 员工视角</text><text x="168" y="448" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">· 你的主导动机是什么</text><text x="168" y="474" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">· 当前哪个需求没被满足</text><text x="168" y="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">· 未来该争取什么机会、补哪一块</text><rect x="640" y="380" width="420" height="150" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="850" y="414" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" letter-spacing="0px" fill="#2F6BFF">Leader/HR 他评 · 管理视角</text><text x="668" y="448" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">· 该成员被什么驱动</text><text x="668" y="474" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">· 该给他分什么活、怎么激励</text><text x="668" y="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">· 团队缺哪种驱动、怎么补位</text><line x1="560" y1="300" x2="360" y2="378" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><line x1="640" y1="300" x2="840" y2="378" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><text x="600" y="588" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">他评仅限直属成员、且过程对本人透明可复核</text>
</svg>
