<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="860" viewBox="0 0 1680 860">
  <title>同一份诊断，按使用者切换建议视角</title>
  <desc>Editable Geometry Blue board for the employee-motivation skill.</desc>
  <rect x="0" y="0" width="1680" height="860" fill="#fdf0e0" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1680" height="250" fill="#375dfe" stroke="none" stroke-width="0"/><text x="70" y="96" text-anchor="start" font-size="58" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">同一份诊断，按使用者切换建议视角</text><text x="70" y="166" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">自测看发展，管理看授权</text><text x="70" y="325" text-anchor="start" font-size="36" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">同一份证据，按使用者切换建议</text><rect x="70" y="385" width="500" height="315" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="105" y="480" text-anchor="start" font-size="80" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">01</text><text x="105" y="535" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">员工自测</text><text x="105" y="585" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">看发展</text><text x="105" y="615" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">主导动机是什么</text><text x="105" y="655" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">哪个需求没被满足</text><text x="105" y="695" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">下一步争取什么机会</text><rect x="590" y="385" width="500" height="315" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="625" y="480" text-anchor="start" font-size="80" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">02</text><text x="625" y="535" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">Leader / HR 他评</text><text x="625" y="585" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">看授权</text><text x="625" y="615" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">该成员被什么驱动</text><text x="625" y="655" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">该分什么活、怎么激励</text><text x="625" y="695" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">团队缺哪种驱动</text><rect x="1110" y="385" width="500" height="315" fill="#375dfe" stroke="#1a2240" stroke-width="4"/><text x="1145" y="480" text-anchor="start" font-size="80" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">03</text><text x="1145" y="535" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">共同底线</text><text x="1145" y="585" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">透明可复核</text><text x="1145" y="615" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">成员知情</text><text x="1145" y="655" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">证据可回看</text><text x="1145" y="695" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">结论用于发展与授权</text><rect x="70" y="755" width="1540" height="55" fill="#fdf0e0" stroke="#2741c0" stroke-width="3"/><text x="90" y="791" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#2741c0">他评只对直属成员开放，过程对本人透明可复核。</text>
</svg>
