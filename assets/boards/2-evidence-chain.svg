<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>基于飞书资产诊断，每条结论都有支撑逻辑</title>
  <desc>Geometry Board for the 员工动机诊断 skill.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#222222" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF" />
  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">基于飞书资产诊断，每条结论都有支撑逻辑</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">OKR · 文档 · 周会 · 与 Agent 的交流 · 消息 → 双模型 → 证据链</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><rect x="110" y="188" width="190" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.3" /><text x="205" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">OKR</text><line x1="300" y1="208" x2="452" y2="208" stroke="#B8B8B8" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="110" y="242" width="190" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.3" /><text x="205" y="268" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">员工文档</text><line x1="300" y1="262" x2="452" y2="262" stroke="#B8B8B8" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="110" y="296" width="190" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.3" /><text x="205" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">周会表现</text><line x1="300" y1="316" x2="452" y2="316" stroke="#B8B8B8" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="110" y="350" width="190" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.3" /><text x="205" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">与 Agent 的交流</text><line x1="300" y1="370" x2="452" y2="370" stroke="#B8B8B8" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="110" y="404" width="190" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.3" /><text x="205" y="430" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#111111">对话消息(辅助)</text><line x1="300" y1="424" x2="452" y2="424" stroke="#B8B8B8" stroke-width="1.2" marker-end="url(#arrow)" /><circle cx="540" cy="330" r="62" fill="#2F6BFF" stroke="#222222" stroke-width="1.5" /><text x="540" y="321.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">双模型</text><text x="540" y="343.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="650" letter-spacing="0px" fill="#FFFFFF">诊断</text><line x1="602" y1="330" x2="700" y2="330" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="716" y="214" width="372" height="232" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" /><text x="902" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="650" letter-spacing="0px" fill="#111111">每条结论带证据链</text><text x="740" y="292" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="600" letter-spacing="0px" fill="#2F6BFF">维度：倾向强/中/弱</text><text x="740" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">├ 支撑证据：哪个资产的哪条行为</text><text x="740" y="360" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">├ 推断逻辑：为什么指向这个维度</text><text x="740" y="394" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">└ 置信度 + 需本人确认</text><text x="600" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">行为不完全等于动机，结论为推断，最终需本人确认</text>
</svg>
