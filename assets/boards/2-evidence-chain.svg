<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="860" viewBox="0 0 1680 860">
  <title>飞书资产经过双模型，形成证据链</title>
  <desc>Editable Geometry Blue board for the employee-motivation skill.</desc>
  <rect x="0" y="0" width="1680" height="860" fill="#fdf0e0" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1680" height="200" fill="#375dfe" stroke="none" stroke-width="0"/><text x="70" y="96" text-anchor="start" font-size="58" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">飞书资产经过双模型，形成证据链</text><text x="70" y="166" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">每条结论都能回溯到具体行为</text><text x="90" y="235" text-anchor="start" font-size="28" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">证据来源</text><text x="720" y="235" text-anchor="start" font-size="28" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">如何进入诊断</text><text x="1490" y="235" text-anchor="middle" font-size="28" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">质量</text><rect x="70" y="290" width="600" height="130" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="100" y="345" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">1 · 工作目标与文档</text><text x="100" y="390" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">具体行为留下可回看的痕迹</text><rect x="700" y="290" width="720" height="130" fill="#375dfe" stroke="#1a2240" stroke-width="3"/><text x="726" y="345" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">目标、项目、交付物</text><text x="726" y="390" text-anchor="start" font-size="23" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">映射维度 → 推断逻辑 → 置信度</text><rect x="1435" y="290" width="175" height="130" fill="#375dfe" stroke="#1a2240" stroke-width="4"/><text x="1522" y="368" text-anchor="middle" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">可追溯</text><rect x="70" y="445" width="600" height="130" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="100" y="500" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">2 · 会议、周会与 Agent</text><text x="100" y="545" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">具体行为留下可回看的痕迹</text><rect x="700" y="445" width="720" height="130" fill="#fdf0e0" stroke="#1a2240" stroke-width="3"/><text x="726" y="500" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">推进方式、决策与反馈</text><text x="726" y="545" text-anchor="start" font-size="23" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">映射维度 → 推断逻辑 → 置信度</text><rect x="1435" y="445" width="175" height="130" fill="#375dfe" stroke="#1a2240" stroke-width="4"/><text x="1522" y="523" text-anchor="middle" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">可解释</text><rect x="70" y="600" width="600" height="130" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="100" y="655" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">3 · 消息（仅作辅助）</text><text x="100" y="700" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">具体行为留下可回看的痕迹</text><rect x="700" y="600" width="720" height="130" fill="#fdf0e0" stroke="#1a2240" stroke-width="3"/><text x="726" y="655" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">交叉验证，不单独定论</text><text x="726" y="700" text-anchor="start" font-size="23" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">映射维度 → 推断逻辑 → 置信度</text><rect x="1435" y="600" width="175" height="130" fill="#375dfe" stroke="#1a2240" stroke-width="4"/><text x="1522" y="678" text-anchor="middle" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">需确认</text>
</svg>
