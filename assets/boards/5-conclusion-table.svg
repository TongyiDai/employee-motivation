<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900">
  <rect width="1240" height="900" fill="#FFFFFF" />
  <text x="60" y="58" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27px" font-weight="700" fill="#111111">员工动机诊断 · 结论表</text><text x="60" y="88" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">一条逻辑线：被什么驱动 → 现在的状态 → 这意味着什么 → 所以该怎么办</text><rect x="60" y="120" width="1180" height="44" fill="#F2F5FF" /><text x="80" y="149" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="700" fill="#2F6BFF">诊断维度</text><text x="270" y="149" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="700" fill="#2F6BFF">诊断结果（大白话）</text><text x="700" y="149" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="700" fill="#2F6BFF">支撑论据（来自飞书 / Agent 交流）</text><text x="80" y="204" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" fill="#111111">你被什么驱动</text><text x="270" y="200" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="500" fill="#111111">主导是成就需要，其次是权力/</text><text x="270" y="224" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="500" fill="#111111">影响需要，亲和需要偏弱。</text><text x="700" y="198" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">1. 成就（强）：OKR 定了「从零搭建</text><text x="700" y="220" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">   监控体系」拉伸目标；5000 字复盘</text><text x="700" y="242" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">2. 权力（中）：牵头跨团队专项，</text><text x="700" y="264" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">   协调三个组</text><text x="80" y="354" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" fill="#111111">你现在的状态</text><text x="270" y="350" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="500" fill="#111111">归属 偏低；自主、胜任 尚可。</text><text x="700" y="348" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">1. 归属（偏低）：较少参与团队活动，</text><text x="700" y="370" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">   多为独立作战</text><text x="700" y="392" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">2. 自主（尚可）：自主设定拉伸目标</text><text x="700" y="414" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">3. 胜任（尚可）：写了 5000 字复盘</text><rect x="60" y="464" width="1180" height="150" fill="#F7F7F7" /><text x="80" y="504" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" fill="#111111">这意味着什么</text><text x="80" y="532" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="600" fill="#2F6BFF">▲ 关键</text><text x="270" y="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="500" fill="#111111">想要的是「成就」，但当前「归属」</text><text x="270" y="524" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="500" fill="#111111">偏低——方向对，动力却在流失，</text><text x="270" y="548" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="500" fill="#111111">这是最该优先补的地方。</text><text x="700" y="498" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">1. 从「搞定难事」本身获得满足，</text><text x="700" y="520" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">   不是靠钱或头衔</text><text x="700" y="542" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">2. 团队连接偏弱、孤军奋战，</text><text x="700" y="564" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">   时间长了动力会被磨掉</text><text x="80" y="654" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="700" fill="#111111">所以该怎么办</text><text x="270" y="650" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="500" fill="#111111">把机会给对，同时补上偏低的需求。</text><text x="700" y="648" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">1. 争取有难度、能拉伸的项目，</text><text x="700" y="670" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">   让成果被看见</text><text x="700" y="692" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">2. 补团队连接、别让 TA 长期</text><text x="700" y="714" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5px" font-weight="400" fill="#666666">   孤军奋战</text><rect x="60" y="120" width="1180" height="644" fill="none" stroke="#111111" stroke-width="1.5" /><line x1="250" y1="120" x2="250" y2="764" stroke="#E8E8E8" stroke-width="1" /><line x1="680" y1="120" x2="680" y2="764" stroke="#E8E8E8" stroke-width="1" /><line x1="60" y1="164" x2="1240" y2="164" stroke="#E8E8E8" stroke-width="1" /><line x1="60" y1="314" x2="1240" y2="314" stroke="#E8E8E8" stroke-width="1" /><line x1="60" y1="464" x2="1240" y2="464" stroke="#E8E8E8" stroke-width="1" /><line x1="60" y1="614" x2="1240" y2="614" stroke="#E8E8E8" stroke-width="1" /><text x="60" y="798" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#8A8A8A">诊断结果是大白话总结；支撑论据用 1. 2. 3. 分条，均可回溯到飞书资产或与 Agent 的交流。</text><text x="60" y="822" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#8A8A8A">行为不完全等于动机，结论为推断，最终需本人确认。</text>
</svg>
