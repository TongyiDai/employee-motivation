<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="860" viewBox="0 0 1680 860">
  <title>发展性诊断，守住透明边界</title>
  <desc>Editable Geometry Blue board for the employee-motivation skill.</desc>
  <rect x="0" y="0" width="1680" height="860" fill="#fdf0e0" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1680" height="250" fill="#375dfe" stroke="none" stroke-width="0"/><text x="70" y="96" text-anchor="start" font-size="58" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">发展性诊断，守住透明边界</text><text x="70" y="166" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">行为是推断，最终解释权留给本人</text><text x="70" y="325" text-anchor="start" font-size="36" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">诊断用于把机会给对，也用于守住人的边界</text><rect x="70" y="385" width="500" height="315" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="105" y="480" text-anchor="start" font-size="80" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">01</text><text x="105" y="535" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">发展对话</text><text x="105" y="595" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">主导动机</text><text x="105" y="645" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">满足状态</text><text x="105" y="695" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">下一步机会</text><rect x="590" y="385" width="500" height="315" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="625" y="480" text-anchor="start" font-size="80" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">02</text><text x="625" y="535" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">透明可复核</text><text x="625" y="595" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">本人知情</text><text x="625" y="645" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">证据可回看</text><text x="625" y="695" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">保留替代解释</text><rect x="1110" y="385" width="500" height="315" fill="#375dfe" stroke="#1a2240" stroke-width="4"/><text x="1145" y="480" text-anchor="start" font-size="80" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">03</text><text x="1145" y="535" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">明确拒绝</text><text x="1145" y="595" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">性格标签</text><text x="1145" y="645" text-anchor="start" font-size="26" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">绩效打分</text><text x="1145" y="695" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">人员排序 / 背对背画像</text><rect x="70" y="755" width="1540" height="55" fill="#fdf0e0" stroke="#2741c0" stroke-width="3"/><text x="90" y="791" text-anchor="start" font-size="24" font-family="Noto Sans SC" font-weight="700" fill="#2741c0">行为是动机线索；主观感受仍需本人确认，结论用于发展与授权。</text>
</svg>
