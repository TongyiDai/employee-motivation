<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="960" viewBox="0 0 1680 960">
  <title>两个成熟模型叠加，形成完整诊断</title>
  <desc>Editable Geometry Blue board for the employee-motivation skill.</desc>
  <rect x="0" y="0" width="1680" height="960" fill="#fdf0e0" stroke="none" stroke-width="0"/><rect x="0" y="0" width="620" height="960" fill="#375dfe" stroke="none" stroke-width="0"/><text x="70" y="210" text-anchor="start" font-size="120" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">双</text><text x="70" y="330" text-anchor="start" font-size="120" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">模型</text><rect x="70" y="430" width="490" height="320" fill="#ffffff" stroke="none" stroke-width="0"/><text x="102" y="498" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">麦克利兰 × SDT</text><text x="102" y="548" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">一个看驱动方向，</text><text x="102" y="596" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">一个看满足状态，</text><text x="102" y="668" text-anchor="start" font-size="28" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">一起看，才知道怎么给机会</text><text x="700" y="200" text-anchor="start" font-size="66" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">一个问题：</text><text x="700" y="288" text-anchor="start" font-size="66" font-family="Noto Sans SC" font-weight="700" fill="#1a2240">什么在驱动他？</text><text x="700" y="376" text-anchor="start" font-size="66" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">这股劲顺不顺？</text><rect x="700" y="430" width="920" height="290" fill="#375dfe" stroke="none" stroke-width="0"/><text x="736" y="510" text-anchor="start" font-size="40" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">结论：方向 × 状态，</text><text x="736" y="566" text-anchor="start" font-size="40" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">才是一份能指导工作的诊断。</text><text x="736" y="660" text-anchor="start" font-size="30" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">成就 / 亲和 / 影响 × 自主 / 胜任 / 归属</text><rect x="700" y="770" width="290" height="140" fill="#375dfe" stroke="#1a2240" stroke-width="4"/><text x="845" y="840" text-anchor="middle" font-size="32" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">驱动方向</text><rect x="1010" y="770" width="290" height="140" fill="#375dfe" stroke="#1a2240" stroke-width="4"/><text x="1155" y="840" text-anchor="middle" font-size="32" font-family="Noto Sans SC" font-weight="700" fill="#fdf0e0">满足状态</text><rect x="1320" y="770" width="290" height="140" fill="#ffffff" stroke="#1a2240" stroke-width="4"/><text x="1465" y="840" text-anchor="middle" font-size="32" font-family="Noto Sans SC" font-weight="700" fill="#375dfe">发展行动</text>
</svg>
