<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>两个成熟模型叠加，不靠拍脑袋</title>
  <desc>Geometry Board for the 员工动机诊断 skill.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#222222" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF" />
  <text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" letter-spacing="0px" fill="#111111">两个成熟模型叠加，不靠拍脑袋</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">麦克利兰三需要定方向 × 自我决定理论 SDT 定状态</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1" /><rect x="120" y="210" width="420" height="300" fill="#F5F5F5" stroke="none" stroke-width="0" /><text x="330" y="246" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#666666">麦克利兰三需要 · 方向</text><text x="330" y="270" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">被什么驱动</text><rect x="156" y="286" width="348" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="180" y="312" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">成就</text><text x="250" y="312" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">想把事做到最好</text><rect x="156" y="344" width="348" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="180" y="370" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">亲和</text><text x="250" y="370" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">想要关系与归属</text><rect x="156" y="402" width="348" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="180" y="428" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#111111">影响</text><text x="250" y="428" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">想影响与推动</text><rect x="660" y="210" width="420" height="300" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1" /><text x="870" y="246" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15px" font-weight="600" letter-spacing="0px" fill="#666666">自我决定理论 SDT · 状态</text><text x="870" y="270" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">被满足了没</text><rect x="696" y="286" width="348" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="720" y="312" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#2F6BFF">自主</text><text x="788" y="312" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">自己决定、认同</text><rect x="696" y="344" width="348" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="720" y="370" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#2F6BFF">胜任</text><text x="788" y="370" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">有能力、在变强</text><rect x="696" y="402" width="348" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.4" /><text x="720" y="428" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17px" font-weight="650" letter-spacing="0px" fill="#2F6BFF">归属</text><text x="788" y="428" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" letter-spacing="0px" fill="#666666">被连接、被在意</text><circle cx="600" cy="360" r="30" fill="#2F6BFF" stroke="#222222" stroke-width="1.5" /><text x="600" y="368" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="30px" font-weight="700" letter-spacing="0px" fill="#FFFFFF">×</text><text x="600" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" letter-spacing="0px" fill="#666666">方向 × 状态 = 立体诊断，而非贴标签</text>
</svg>
